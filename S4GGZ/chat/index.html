<html>
    <head>
        <title>Chat</title>
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="header-left">
                <a href="../index.html" class="brand">
                    <span class="brand-text">Home</span>
                </a>
                <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu" aria-expanded="true">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
            <div class="header-right">
                <button id="theme-toggle" aria-label="Toggle theme" class="theme-toggle">🌙</button>
                <a href="../about/index.html">About</a>
                <a href="../faq/index.html">FAQ</a>
            </div>
        </header>

        <aside class="side-menu">
            <nav>
                <a href="../games/index.html">Games</a>
                <a href="../projects-status/index.html">Projects Status</a>
                <a href="index.html">Chat</a>
            </nav>
        </aside>

        <main class="content">
            <div class="chat-box">
                <div class="chat-header">
                    <h2>Chat</h2>
                    <button id="change-username" class="small-btn">Change</button>
                </div>
                <div id="messages" class="messages" aria-live="polite"></div>
                <form id="chat-form" class="chat-form">
                    <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" required maxlength="5000" />
                    <button type="submit">Send</button>
                    <div id="char-counter" class="char-counter">0/5000</div>
                </form>

                <!-- Username modal -->
                <div id="username-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
                    <div class="modal-content">
                        <h3>Choose a username</h3>
                        <p>Pick a display name for chat (It will not be saved as an account).</p>
                        <form id="username-form">
                            <input id="username-input" type="text" minlength="1" maxlength="32" placeholder="Your name" required />
                            <div class="modal-actions">
                                <button type="submit">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            © 2026 S4GGZ's company. All rights reserved.
        </footer>

        <script src="../script.js"></script>
    </body>
</html>
